<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="newsletter-card">
        <h3>Subscribe to Our Newsletter</h3>
        <p>Get the latest updates and resources delivered straight to your inbox.</p>

        <!-- Newsletter Form -->
        <form id="newsletterForm" novalidate>
            <div class="input-group">
                <input 
                    type="email" 
                    id="emailInput" 
                    placeholder="Enter your email address" 
                    required
                >
                <button type="submit">Subscribe</button>
            </div>
            <!-- Error message feedback -->
            <span id="errorMessage" class="error-message"></span>
        </form>

        <!-- Thank-You Message Container (Hidden by default) -->
        <div id="thankYouMessage" class="thank-you hidden">
            🎉 **Thank you for subscribing!** We’ve saved your email successfully.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
